name: VK AutoPost

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Update feed
        run: |
          python bot.py
          git config user.name "bot"
          git config user.email "bot@://github.com"
          git add feed.xml post.jpg
          git commit -m "new post" || exit 0
          git push
